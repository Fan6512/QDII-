<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理端 · 候选确认（需密钥）</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--tile-1);color:var(--on-dark);
    padding:20px 16px 60px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:20px;font-weight:600;letter-spacing:-0.3px;line-height:1.2}
  .sub{font-size:12.5px;color:var(--on-dark-2);margin-top:6px;line-height:1.6}
  .panel{background:var(--tile-2);border:1px solid var(--hairline-dark);border-radius:var(--r-lg);padding:16px;margin-top:16px}
  label{font-size:13px;color:var(--on-dark-2);display:block;margin-bottom:8px}
  input[type=password]{width:100%;background:var(--tile-3);border:1px solid var(--hairline-dark);color:var(--on-dark);
    border-radius:var(--r-sm);padding:11px 12px;font-size:14px;outline:none}
  input[type=password]:focus{border-color:var(--accent-on-dark)}
  .row{display:flex;gap:10px;margin-top:12px}
  button{flex:1;border:none;border-radius:var(--r-sm);padding:11px 0;font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .1s var(--ease-apple),background .2s var(--ease-apple),opacity .2s}
  button:active{transform:var(--press)}
  .btn-primary{background:var(--accent-on-dark);color:#001033}
  .btn-ghost{background:transparent;border:1px solid var(--hairline-dark);color:var(--on-dark-2)}
  .msg{font-size:12.5px;margin-top:12px;padding:9px 11px;border-radius:var(--r-sm);display:none}
  .msg.err{display:block;background:var(--loss-bg-dark);color:#ff9a9a;border:1px solid #5b2226}
  .msg.ok{display:block;background:var(--gain-bg-dark);color:#86efac;border:1px solid #1f4a36}
  .card{background:var(--tile-2);border:1px solid var(--hairline-dark);border-radius:var(--r-lg);padding:14px;margin-top:12px}
  .fn{font-size:15px;font-weight:600;letter-spacing:-0.2px}
  .fc{font-size:11.5px;color:var(--on-dark-2);margin-top:2px}
  .tags{margin:10px 0;display:flex;gap:6px}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-sm);
    background:rgba(255,255,255,0.1);color:var(--on-dark-2)}
  .quota{font-size:13px;color:var(--on-dark-2)}.quota b{color:var(--on-dark)}
  .status{font-size:12px;margin:8px 0;color:var(--warn-dark)}
  .status.open{color:var(--gain-dark)}.status.paused{color:var(--loss-dark)}.status.limited{color:var(--warn-dark)}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;padding:9px 0;font-size:13px;border-radius:var(--r-sm);border:none;font-weight:600;cursor:pointer}
  .acts .add{background:var(--gain-dark);color:#06281a}
  .acts .skip{background:transparent;border:1px solid var(--hairline-dark);color:var(--on-dark-2)}
  .acts button:disabled{opacity:.4;cursor:not-allowed}
  .hidden{display:none}
  .empty{color:var(--on-dark-2);font-size:13px;text-align:center;padding:24px 0}
  @media (prefers-reduced-motion: reduce){
    button{transition:none}
    button:active{transform:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 候选确认 · 管理端</h1>
  <div class="sub">输入管理密钥以进入。密钥仅保存在本机浏览器 localStorage，不会发给除 /api/confirm 外的任何地方。</div>

  <div class="panel" id="gate">
    <label for="key">管理密钥 (ADMIN_KEY)</label>
    <input type="password" id="key" placeholder="粘贴你的 ADMIN_KEY" autocomplete="off" />
    <div class="row">
      <button class="btn-primary" id="enter">进入</button>
      <button class="btn-ghost" id="clear">清除本地密钥</button>
    </div>
    <div class="msg err" id="gateMsg"></div>
  </div>

  <div id="main" class="hidden">
    <div class="sub" style="margin-top:16px">待确认候选（自动发现的新基金）。「加入」即生效并刷新公开展示页；「忽略」仅移除候选。</div>
    <div id="list"></div>
    <div class="empty hidden" id="empty">🎉 暂无待确认候选</div>
  </div>
</div>

<script>
const KEY_STORE = "qdii_admin_key";
let ADMIN_KEY = localStorage.getItem(KEY_STORE) || "";

const $ = id => document.getElementById(id);
function showMsg(el, txt){ el.textContent = txt; el.style.display = "block"; }
function clearMsg(el){ el.style.display = "none"; el.textContent = ""; }

async function api(path, payload){
  const res = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json", "x-admin-key": ADMIN_KEY },
    body: JSON.stringify(payload),
  });
  const data = await res.json().catch(()=>({ok:false, error:"响应解析失败"}));
  return { status: res.status, data };
}

async function enter(){
  ADMIN_KEY = $("key").value.trim();
  if(!ADMIN_KEY){ showMsg($("gateMsg"), "请输入密钥"); return; }
  clearMsg($("gateMsg"));
  // 用一次确认请求探活
  const { status } = await api("/api/confirm", { action:"ignore", code:"__probe__" });
  if(status === 401){ showMsg($("gateMsg"), "密钥错误，未授权"); return; }
  localStorage.setItem(KEY_STORE, ADMIN_KEY);
  $("gate").classList.add("hidden");
  $("main").classList.remove("hidden");
  load();
}

async function load(){
  const res = await fetch("/api/admin/candidates", { cache:"no-store", headers: { "x-admin-key": ADMIN_KEY } });
  if(res.status === 401){ alert("密钥失效，请重新进入"); location.reload(); return; }
  if(!res.ok){ alert("候选加载失败"); return; }
  const db = await res.json();
  const list = db.candidates || [];
  const wrap = $("list");
  if(!list.length){ wrap.innerHTML = ""; $("empty").classList.remove("hidden"); return; }
  $("empty").classList.add("hidden");
  wrap.innerHTML = list.map((c,i)=>{
    const cls = c.category === "NASDAQ100" ? "nasdaq" : c.category === "SP500" ? "sp" : "";
    const t = c.category === "NASDAQ100" ? "纳指100" : c.category === "SP500" ? "标普500" : "?";
    const eq = c.trackType === "equal_weight";
    return `<div class="card ${eq?'eq':''}">
      <div class="fn">${escapeHtml(c.short_name||c.name)}${eq?'（等权）':''}</div>
      <div class="fc">${escapeHtml(c.code)} · ${escapeHtml(c.company||'')}</div>
      <div class="tags"><span class="tag ${cls}">${t}</span>${eq?'<span class="tag eq">等权</span>':''}</div>
      <div class="status ${['open','paused','limited'].includes(c.status) ? c.status : ''}">申购状态：${c.status === 'open' ? '开放' : c.status === 'limited' ? '限额申购' : c.status === 'paused' ? '暂停' : '待核验'}</div>
      <div class="quota">今日限买 <b>¥${escapeHtml((c.limit_daily??'无上限').toLocaleString('zh-CN'))}</b> · 起购 ¥${escapeHtml(c.min_subscribe??'-')} · 优惠费率 ${escapeHtml(c.fee_discount??'-')}%</div>
      <div class="acts">
        <button class="add" data-i="${i}" data-code="${escapeHtml(c.code)}" data-act="confirm">加入清单</button>
        <button class="skip" data-i="${i}" data-code="${escapeHtml(c.code)}" data-act="ignore">忽略</button>
      </div>
    </div>`;
  }).join("");
  wrap.querySelectorAll("button[data-act]").forEach(b=>{
    b.onclick = ()=> act(b.dataset.act, b.dataset.code, b);
  });
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>'\"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
}

async function act(action, code, btn){
  btn.disabled = true;
  const { status, data } = await api("/api/confirm", { action, code });
  if(status === 401){ alert("密钥失效，请重新进入"); location.reload(); return; }
  if(!data.ok){ alert("操作失败：" + (data.error||"未知错误")); btn.disabled = false; return; }
  load();
}

$("enter").onclick = enter;
$("clear").onclick = ()=>{ localStorage.removeItem(KEY_STORE); ADMIN_KEY=""; $("key").value=""; alert("已清除本地密钥"); };
if(ADMIN_KEY){ $("key").value = ADMIN_KEY; }
</script>
</body>
</html>
